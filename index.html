<style>
:root{--ground:#F8F8F5;--surface:#FFFFFF;--ink:#1D2126;--muted:#66707E;--line:#E1E3DE;--line-strong:#C9CCC5;--accent:#2C4E96;--accent-ink:#FFF;--accent-soft:#EDF1F9;--ok:#2E7D5B;--ok-soft:#E7F3ED;--warn:#B7791F;--warn-soft:#FBF2E3;--err:#B3402E;--purple:#6B4FA8;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--sans:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ground:#131619;--surface:#1C2126;--ink:#E6E8EB;--muted:#98A2B0;--line:#2A3038;--line-strong:#3A414B;--accent:#82A4E8;--accent-ink:#10151F;--accent-soft:#232B3A;--ok:#5CB893;--ok-soft:#1B2C25;--warn:#D9A24A;--warn-soft:#2B2417;--err:#D97862;--purple:#A98BE0}}
:root[data-theme="dark"]{--ground:#131619;--surface:#1C2126;--ink:#E6E8EB;--muted:#98A2B0;--line:#2A3038;--line-strong:#3A414B;--accent:#82A4E8;--accent-ink:#10151F;--accent-soft:#232B3A;--ok:#5CB893;--ok-soft:#1B2C25;--warn:#D9A24A;--warn-soft:#2B2417;--err:#D97862;--purple:#A98BE0}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:660px;margin:0 auto;padding:26px 18px 96px}
header{border-bottom:2px solid var(--ink);padding-bottom:15px;margin-bottom:16px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:500}
h1{font-size:25px;font-weight:700;letter-spacing:-.01em;margin:6px 0 9px}
.lede{color:var(--muted);font-size:13.5px;margin:0;max-width:60ch}
.counts{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.pill{font-family:var(--mono);font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;letter-spacing:.05em;background:var(--accent-soft);color:var(--accent)}
.pill.z{background:var(--ground);color:var(--muted);border:1px solid var(--line)}
.sect{margin:28px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--line-strong)}
.sect h2{font-size:15px;font-weight:700;margin:0 0 3px}
.sect p{margin:0;font-size:12.5px;color:var(--muted)}
.card{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:15px;margin-bottom:13px}
.card.act{border-left:3px solid var(--warn)}
.card.writ{border-left:3px solid var(--purple)}
.card.done{border-left:3px solid var(--ok)}
.ch{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:7px}
.cid{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent)}
.tag{font-family:var(--mono);font-size:10px;font-weight:600;padding:2px 7px;border-radius:99px;letter-spacing:.07em;background:var(--accent-soft);color:var(--accent)}
.tag.w{background:var(--warn);color:#fff}.tag.g{background:var(--ok);color:#fff}.tag.p{background:var(--purple);color:#fff}
.ct{font-size:15.5px;font-weight:700;flex-basis:100%;line-height:1.35}
.meta{font-size:12.5px;color:var(--muted);margin:6px 0 0;line-height:1.6}
.q{font-size:14.5px;margin:8px 0 0}
label{display:block;font-size:12px;font-weight:600;margin-top:11px}
label .h{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:2px}
textarea,input,select{font-family:var(--sans);font-size:16px;color:var(--ink);background:var(--ground);border:1px solid var(--line-strong);border-radius:5px;padding:10px;width:100%;margin-top:5px}
textarea{min-height:96px;resize:vertical;font-size:15px;line-height:1.6}
textarea.tall{min-height:150px}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer;border-radius:5px;padding:10px 15px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink)}
button.p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.g{background:var(--ok);color:#fff;border-color:var(--ok)}
button.d{color:var(--err);border-color:var(--line-strong)}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.filed{margin-top:11px;font-size:12.5px;font-family:var(--mono);color:var(--ok);background:var(--ok-soft);border-radius:5px;padding:8px 11px}
.filed a{color:inherit}
.gh{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:14px 16px;margin-bottom:16px}
.gh .st{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}.dot.on{background:var(--ok)}
.gh p,.gh ol{font-size:12.5px;color:var(--muted);line-height:1.7;margin:9px 0 0}
.gh ol{padding-left:20px}
.gh code{font-family:var(--mono);font-size:11.5px;background:var(--ground);padding:1px 5px;border-radius:3px;color:var(--ink)}
details{margin-top:10px}summary{font-size:12.5px;color:var(--accent);cursor:pointer;font-weight:600}
.pre{font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;background:var(--ground);border:1px solid var(--line);border-radius:5px;padding:10px;margin-top:8px;line-height:1.6}
.empty{padding:20px;text-align:center;color:var(--muted);font-size:13.5px;border:1px dashed var(--line-strong);border-radius:7px}
footer{margin-top:32px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);font-family:var(--mono);line-height:1.8}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:2px solid var(--ink);padding:10px 18px}
.bar .in{max-width:660px;margin:0 auto;display:flex;gap:10px;align-items:center}
.bar .n{font-family:var(--mono);font-size:12.5px;flex:1;color:var(--muted);min-width:0}
.bar .n b{color:var(--ink)}
.toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--ground);font-size:13px;font-weight:600;padding:9px 20px;border-radius:99px;opacity:0;transition:opacity .18s;pointer-events:none;z-index:9;max-width:88vw;text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>

<script id="state" type="application/json">{"generated": "2026-10-22", "ledger": {"rows": 25, "directions": {"supports": 6, "breaks": 13, "mixed": 6}}, "gate": [], "mechanisms": [{"id": "P1", "title": "Price Architecture", "claim": "Position does not travel or fail because of *how far* the destination price diverges from Japan. It fails when **no one in the destination market holds pricing authority** — when the shelf price is an output of the export and distribution stack rather than a decision someone made about the position the brand should occupy locally.", "cases": 31, "confidence": "**Moderate on the revised claim. Low on the original — the evidence contradicts it.**\n\nNine rows across four markets. Divergence magnitude predicts nothing: Royce' holds at **2.85×** and has *raised* price 35% in three years; UNIQLO holds at **1.52×** and **1.19×** while expanding; Mo-Mo-Paradise holds at **0.64×**; Marugame holds at **0.93×**. Five of nine rows break the original claim outright.\n\nWhat separates them is not the number. Every held case has an identifiable party in-market with the authority to set price and the will to use it — Noble Restaurant refusing the suki price war on the record, Fast Retailing's JV owning its own channel, PT Wilson Indotama raising a distributor price, Sriboga's manufacturing-depth JV. Every eroded case has the opposite: **Snow Peak's Thai price is set by a multi-brand dealer it does not operate; Zojirushi's official Vietnamese price is set by an export stack that charges 14% more for a lower-tier micom unit than the grey channel charges for the real IH one.**\n\nThat last row (**V-009**) is the strongest single piece of evidence in the corpus, because it shows the mechanism rather than a correlation — and it explains why the export line-up carries model codes that exist nowhere in Japan. Disjoint codes make the comparison unperformable. A price that cannot be checked is a price nobody had to justify.\n\n**What holds this back from high confidence:**\n- **A category confound I cannot yet rule out.** Both supports rows are durable goods sold through dealers; four of five breaks rows are F&B or apparel with operator control. Category and pricing authority are currently collinear in this sample.\n- **`local_comparison_set` is empty on eight of nine rows** — the reference-frame lane never ran. Every claim here is about the *Japan-relative* price, never about what that money buys locally, which is the half a buyer actually experiences.\n- **Two rows sit in a weaker evidentiary class**: V-009 is grey-channel and marketplace-priced on both sides; V-008's destination price is a third-party aggregator.\n- **Nothing here is P2, P3, P4 or P5.** This is a one-mechanism corpus arguing about a five-mechanism question.", "change": "1. **A brand with clear local pricing authority that priced deliberately and still lost position.** One well-evidenced case — a local operator or owned subsidiary that set its own price to a chosen position and was pushed out anyway — and the revised claim is wrong, not merely incomplete.\n2. **A brand with no local pricing authority whose position held for 5+ years anyway.** A pure export-stack price, dealer-set, sustained at a premium with stable or growing footprint, would show authority is not the deciding variable.\n3. **Category, not authority, doing the work.** If a durable-goods brand with real local pricing authority erodes, or an F&B brand without it holds, the confound above resolves against me and the mechanism is really about how a category is distributed, not about who sets the price.\n4. **A local comparison set that inverts the reading.** If the destination price turns out to be *at or below* the local premium set in the cases I have called eroded, then the buyer's reference frame — not the pricing structure — is carrying the outcome, and this belongs in P2.\n5. **Landed-cost evidence showing the stack leaves no discretion.** If P4 shows freight, duty and margin stacking arket": "MY", "why": "Mass-at-home control class (same class as V-001/V-005/V-008/V-011), same brand as BACKLOG #40 (→ID, pre-entry) but a different market, already operating: first Malaysian outlet opened AEON Mall Taman Maluri 2026-06-04 (\"expected to be Saizeriya's first halal-compliant outlet,\" per the Japanese Embassy in Malaysia), entry price RM8.90 stated; second KL outlet (LaLaport BBCC) opening November 2026, 1→2 stores in five months. Sources: SAYS https://says.com/my/lifestyle/eats/saizeriya-to-open-2nd-kl-outlet-at-lalaport-bbcc-this-november (2026-09-15, en); Embassy of Japan in Malaysia https://www.my.emb-japan.go.jp/itpr_en/newinfo_04062026.html (2026-06-04, en, corroborating). (2026-10-16 sweep, A5 free-hunt)"}, {"n": "78", "brand": "Mikazuki ホテル三日月グループ", "market": "VN (Hanoi; existing Da Nang resort)", "why": "Japanese onsen-hotel group taking a 6F anchor (\"Mikazuki Onsen & Spa\") in the Japanese-developed Hanoi Takashimaya S.C. mall (opening autumn 2027); already operates a five-star resort in Da Nang today, rate-priceable now — same shape as V-016 Hoshino→ID (rate position vs. local five-star set), with a second-property positioning announced in-window. Sources: 株式会社髙島屋/東神開発 press release (PDF) https://www.takashimaya.co.jp/base/corp/topics/261015g.pdf (2026-10-15, ja, primary); 流通ニュース https://www.ryutsuu.biz/abroad/s101678.html (2026-10-16, ja, corroborating); CafeF https://cafef.vn/onsen-trong-long-do-thi-trai-nghiem-moi-cua-trung-tam-thuong-mai-188261006150544335.chn (2026-10-08, vi, local reading, pre-window). (2026-10-20 discover)"}, {"n": "79", "brand": "Kohnan コーナン商事", "market": "VN", "why": "**Flag for Rahut, not decided here: Kohnan is mass-tier in Japan**, same category/mode question as other flagged rows. Direct-subsidiary home-centre chain, now 18 Vietnam stores (9th in the north), opened its newest as sub-anchor of AEON Mall Thanh Hóa 2026-10-15 — the P3 contrast to Nitori→VN/ID/MY/SG (same category, same markets, far deeper footpr of an old receipt, a screenshot from a personal photo library, or anyone's memory of a specific SKU and price from the Grand Indonesia store before 2021-03-21; a grey-market/resale listing naming a specific historical ID price would also do.", "tried": "every live ID e-commerce channel (mujiindonesiastore.com NXDOMAIN, blibli.com 403, tokopedia.com stream errors), every Indonesian-language press search on the 2011 launch and 2021 closure (none carry a price), web.archive.org/archive.ph (hard-blocked, confirmed at the agent-proxy egress layer this sweep, independently by three separate lanes plus the verifier), two candidate historical blog leads (talkativetya.com, roosvansia.com — both dead, 502/422/522)."}]}</script>

<script>
(function(){
"use strict";
var CFG=JSON.parse(document.getElementById("cfg").textContent);
var S=JSON.parse(document.getElementById("state").textContent);
var DKEY="vd-drafts-v1", TKEY="vw-gh-token";
var drafts=ld(DKEY,{}), token=tok(), busy=false;

function ld(k,d){try{return JSON.parse(localStorage.getItem(k))||d;}catch(e){return d;}}
function sv(){try{localStorage.setItem(DKEY,JSON.stringify(drafts));}catch(e){}}
function tok(){try{return localStorage.getItem(TKEY)||"";}catch(e){return "";}}
function stok(t){try{t?localStorage.setItem(TKEY,t):localStorage.removeItem(TKEY);}catch(e){}token=t;}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function toast(t){var e=document.getElementById("toast");e.textContent=t;e.classList.add("show");setTimeout(function(){e.classList.remove("show");},2400);}
function pending(){return Object.keys(drafts).filter(function(k){return !drafts[k].issue;});}

function gh(path,opts){opts=opts||{};
  return fetch("https://api.github.com/repos/"+CFG.owner+"/"+CFG.repo+path,{method:opts.method||"GET",
    headers:{"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"},
    body:opts.body?JSON.stringify(opts.body):undefined})
  .then(function(r){return r.json().catch(function(){return{};}).then(function(j){
    if(!r.ok){var e=new Error(j.message||("HTTP "+r.status));e.status=r.status;throw e;} return j;});});}
function why(e){return e.status===401?"Token rejected — wrong or expired.":e.status===403?"Token lacks permission, or rate-limited.":e.status===404?"No access to the repository.":e.status===422?"GitHub refused the issue.":(e.message||"Network error.");}

function file(k){var d=drafts[k]; if(!d||d.issue) return Promise.resolve();
  return gh("/issues",{method:"POST",body:{title:d.title,body:d.body,labels:[d.label]}})
    .then(function(j){d.issue=j.number;d.url=j.html_url;sv();});}

/* ---- builders ---- */
function saveDraft(k,o){drafts[k]=o;sv();render();}

function gateCard(g){
  var k="gate:"+g.id, d=drafts[k];
  var h='<div class="card '+(d?"done":"act")+'"><div class="ch"><span class="cid">'+esc(g.id)+'</span>'
   +'<span class="tag w">DECIDE</span><span class="tag">'+esc(g.mechanism)+' · '+esc(g.direction)+'</span>'
   +'<span class="ct">'+esc(g.subject)+'</span></div>'
   +'<p class="meta">'+esc(g.verification)+'</p>';
  if(d) h+='<div class="filed"><b>'+esc(d.mark)+'</b>'+(d.issue?' — filed as #'+d.issue+' <a href="'+esc(d.url)+'" target="_blank" rel="noopener">open</a>':' — not filed yet')+'</div>'
        +'<div class="row"><button data-undo="'+esc(k)+'">Change</button></div>';
  else h+='<label>Why, in a line <span class="h">optional — it becomes the record of your reasoning</span><textarea data-note="'+esc(k)+'" placeholder="Held because entry mode is unknown, which is the one field that would make it explain anything."></textarea></label>'
        +'<div class="row"><button class="g" data-mark="'+esc(k)+'|PROMOTE">Promote</button>'
        +'<button data-mark="'+esc(k)+'|HOLD">Hold</button>'
        +'<button class="d" data-mark="'+esc(k)+'|KILL">Kill</button></div>';
  return h+'</div>';
}

function mechCard(m){
  var k="mech:"+m.id, d=drafts[k];
  var needs = m.unratified || m.scaffold;
  var state = m.unratified?"RATIFY OR REWRITE":(m.scaffold?(m.hand?"YOUR HAND ONLY":"NOT WRITTEN"):"WRITTEN");
  var h='<div class="card '+(d?"done":(needs?"writ":""))+'"><div class="ch"><span class="cid">'+esc(m.id)+'</span>'
   +'<span class="tag '+(needs?"p":"g")+'">'+state+'</span>'
   +'<span class="tag">'+m.cases+' case'+(m.cases===1?"":"s")+'</span>'
   +'<span class="ct">'+esc(m.title)+'</span></div>';
  if(m.claim) h+='<p class="meta"><b>Claim:</b> '+esc(m.claim.slice(0,320))+(m.claim.length>320?"…":"")+'</p>';
  if(m.unratified) h+='<p class="meta" style="color:var(--purple)"><b>Drafted for you, not ratified.</b> Read it, then either ratify as written or replace it with your own words. Nothing publishes from this file until you do.</p>';
  if(m.hand) h+='<p class="meta">This mechanism is yours alone — no agent researches or writes it.</p>';
  if(d) h+='<div class="filed">Written'+(d.issue?' — filed as #'+d.issue+' <a href="'+esc(d.url)+'" target="_blank" rel="noopener">open</a>':' — not filed yet')+'</div>'
        +'<div class="row"><button data-undo="'+esc(k)+'">Change</button></div>';
  else{
    h+='<details><summary>Current text</summary><div class="pre">'+esc((m.confidence||"—").slice(0,900))+'\n\n— WHAT WOULD CHANGE MY MIND —\n\n'+esc((m.change||"—").slice(0,900))+'</div></details>'
     +'<label>Confidence — how much do you believe the claim now?<textarea class="tall" data-f="'+esc(k)+'|confidence" placeholder="Leave blank to keep what is there."></textarea></label>'
     +'<label>What would change my mind<textarea class="tall" data-f="'+esc(k)+'|change" placeholder="Leave blank to keep what is there."></textarea></label>'
     +'<label>Claim <span class="h">optional — only if you want to rewrite it</span><textarea data-f="'+esc(k)+'|claim"></textarea></label>'
     +'<div class="row">'+(m.unratified?'<button class="g" data-ratify="'+esc(k)+'">Ratify as written</button>':'')
     +'<button class="p" data-write="'+esc(k)+'">Save my text</button></div>';
  }
  return h+'</div>';
}

function simpleCard(kind,id,title,meta,label,ph){
  var k=kind+":"+id, d=drafts[k];
  var h='<div class="card '+(d?"done":"act")+'"><div class="ch"><span class="cid">'+esc(id)+'</span>'
   +'<span class="tag '+(kind==="q"?"g":"w")+'">'+(kind==="q"?"ANSWER":"QUEUE")+'</span>'
   +'<span class="ct">'+esc(title)+'</span></div>'
   +(meta?'<p class="meta">'+esc(meta)+'</p>':'');
  if(d) h+='<div class="filed">Answered'+(d.issue?' — filed as #'+d.issue+' <a href="'+esc(d.url)+'" target="_blank" rel="noopener">open</a>':' — not filed yet')+'</div>'
        +'<div class="row"><button data-undo="'+esc(k)+'">Change</button></div>';
  else h+='<label><textarea data-f="'+esc(k)+'|text" placeholder="'+esc(ph)+'"></textarea></label>'
        +'<div class="row"><button class="p" data-simple="'+esc(k)+'|'+label+'|'+esc(title)+'">Save</button></div>';
  return h+'</div>';
}

function render(){
  document.getElementById("ghbox").innerHTML=ghBox();
  var gate=S.gate, mech=S.mechanisms.filter(function(m){return m.unratified||m.scaffold;});
  var done=S.mechanisms.filter(function(m){return !(m.unratified||m.scaffold);});
  var h='<header><span class="eyebrow">Vectura · your desk</span><h1>What is waiting for you</h1>'
   +'<p class="lede">Every open decision and every section only you can write, in one place. Each one files itself to the project when you save it. Nothing else needs your attention.</p>'
   +'<div class="counts"><span class="pill'+(gate.length?"":" z")+'">'+gate.length+' to decide</span>'
   +'<span class="pill'+(mech.length?"":" z")+'">'+mech.length+' to write</span>'
   +'<span class="pill'+(S.questions.length+S.wanted.length?"":" z")+'">'+(S.questions.length+S.wanted.length)+' to answer</span>'
   +'<span class="pill'+(S.backlog.length?"":" z")+'">'+S.backlog.length+' to queue</span>'
   +'<a class="pill z" style="text-decoration:none" href="https://vectura.sideri.io">'+S.ledger.rows+' rows in the ledger →</a></div></header>';

  h+='<div class="sect"><h2>Decide</h2><p>Promote into the ledger, hold, or kill. Blank means nothing happens.</p></div>';
  h+= gate.length ? gate.map(gateCard).join("") : '<div class="empty">Nothing at the gate.</div>';

  h+='<div class="sect"><h2>Write</h2><p>The argument sections. These are yours — they are what you say when someone pushes back.</p></div>';
  h+= mech.length ? mech.map(mechCard).join("") : '<div class="empty">Every mechanism is written.</div>';

  if(S.questions.length||S.wanted.length){
    h+='<div class="sect"><h2>Answer</h2><p>Open questions, and prices only you can get.</p></div>';
    S.questions.forEach(function(q,i){h+=simpleCard("q","Q-"+(i+1),q.text,"","question-answer","One sentence is enough.");});
    S.wanted.forEach(function(w){h+=simpleCard("w",w.id,w.title,w.need,"wanted-answer","Price, where you saw it, model number.");});
  }
  if(S.backlog.length){
    h+='<div class="sect"><h2>Queue</h2><p>Cases the sweep surfaced. Only you promote a candidate into the research queue.</p></div>';
    S.backlog.forEach(function(b){h+=simpleCard("b",b.brand+" ("+b.market+")",b.brand+" → "+b.market,b.why,"backlog-queue","QUEUED, or KILL with a reason.");});
  }
  if(done.length){
    h+='<div class="sect"><h2>Written</h2><p>Nothing needed here — shown so you can see the whole board.</p></div>';
    h+=done.map(mechCard).join("");
  }
  h+='<footer>Built from the project on '+esc(S.generated)+'. Saved answers stay in this browser and file to the project as issues.<br>Public retail facts and your own argument text only.</footer>';
  document.getElementById("app").innerHTML=h;
  var p=pending().length, n=Object.keys(drafts).length;
  document.getElementById("bn").innerHTML = n? ("<b>"+n+"</b> written · "+(p?("<b>"+p+"</b> not filed"):"all filed")) : "Nothing written yet";
  document.getElementById("sendall").disabled=!token||!p;
  wire();
}

function ghBox(){
  if(token) return '<div class="gh"><div class="st"><span class="dot on"></span>Connected — everything you save files itself</div>'
    +'<div class="row"><button id="ghout">Disconnect</button></div></div>';
  return '<div class="gh"><div class="st"><span class="dot"></span>Not connected — saves stay on this device</div>'
   +'<p>Connect once and every decision and every paragraph files itself to the project. The token is stored only in this browser.</p>'
   +'<details><summary>Make a token — 1 minute</summary><ol>'
   +'<li><b>github.com → Settings → Developer settings → Personal access tokens → Fine-grained → Generate new</b></li>'
   +'<li>Resource owner <code>'+esc(CFG.owner)+'</code>, only the <code>'+esc(CFG.repo)+'</code> repository</li>'
   +'<li>Repository permissions → <b>Issues: Read and write</b>. Nothing else.</li></ol></details>'
   +'<label><input type="password" id="ghtok" autocomplete="off" spellcheck="false" placeholder="github_pat_…"></label>'
   +'<div class="row"><button class="p" id="ghsave">Connect</button></div></div>';
}

function each(s,f){Array.prototype.forEach.call(document.querySelectorAll(s),f);}
function val(k,f){var el=document.querySelector('[data-f="'+k+'|'+f+'"]');return el?el.value.trim():"";}

function wire(){
  each("[data-mark]",function(b){b.onclick=function(){
    var a=b.getAttribute("data-mark").split("|"),k=a[0],mark=a[1];
    var id=k.split(":")[1];
    var note=(document.querySelector('[data-note="'+k+'"]')||{}).value||"";
    var g=S.gate.filter(function(x){return x.id===id;})[0]||{};
    saveDraft(k,{mark:mark,label:"gate-decision",title:"Gate: "+mark+" — "+id,
      body:["**Decision: `"+mark+"`**","","| field | value |","|---|---|","| proposal | "+id+" |","| subject | "+(g.subject||"")+" |",
            "| mechanism | "+(g.mechanism||"")+" |","| direction | "+(g.direction||"")+" |","",
            note?("**Reasoning:** "+note):"", "","_Filed from the desk. This is Rahut's mark; the promoter applies it._"].join("\n")});
    if(token) file(k).then(render,function(e){render();toast(why(e));});
  };});
  each("[data-ratify]",function(b){b.onclick=function(){
    var k=b.getAttribute("data-ratify"), id=k.split(":")[1];
    saveDraft(k,{label:"mechanism-text",title:"Mechanism "+id+": ratified as drafted",
      body:"**Ratified as drafted.** Remove the unratified banner from `"+id+"` and treat the argument as mine.\n\n_Filed from the desk._"});
    if(token) file(k).then(render,function(e){render();toast(why(e));});
  };});
  each("[data-write]",function(b){b.onclick=function(){
    var k=b.getAttribute("data-write"), id=k.split(":")[1];
    var c=val(k,"confidence"), ch=val(k,"change"), cl=val(k,"claim");
    if(!c&&!ch&&!cl){toast("Write something first");return;}
    var parts=["**My words for "+id+".** Apply verbatim; do not rewrite.",""];
    if(cl){parts.push("## Claim","",cl,"");}
    if(c){parts.push("## Confidence","",c,"");}
    if(ch){parts.push("## What would change my mind","",ch,"");}
    parts.push("_Filed from the desk. Sections left blank keep their current text._");
    saveDraft(k,{label:"mechanism-text",title:"Mechanism "+id+": my text",body:parts.join("\n")});
    if(token) file(k).then(render,function(e){render();toast(why(e));});
  };});
  each("[data-simple]",function(b){b.onclick=function(){
    var a=b.getAttribute("data-simple").split("|"),k=a[0],label=a[1],title=a[2];
    var t=val(k,"text"); if(!t){toast("Write something first");return;}
    saveDraft(k,{label:label,title:(label==="question-answer"?"Answer: ":label==="backlog-queue"?"Backlog: ":"WANTED answer: ")+title.slice(0,60),
      body:"**"+title+"**\n\n"+t+"\n\n_Filed from the desk._"});
    if(token) file(k).then(render,function(e){render();toast(why(e));});
  };});
  each("[data-undo]",function(b){b.onclick=function(){delete drafts[b.getAttribute("data-undo")];sv();render();};});
  var s=document.getElementById("ghsave");
  if(s) s.onclick=function(){var t=(document.getElementById("ghtok").value||"").trim();
    if(!t){toast("Paste a token first");return;}
    s.disabled=true;s.textContent="Checking…";stok(t);
    gh("").then(function(){render();toast("Connected");},function(e){stok("");render();toast(why(e));});};
  var o=document.getElementById("ghout"); if(o) o.onclick=function(){stok("");render();toast("Disconnected");};
}

document.getElementById("sendall").onclick=function(){
  var p=pending(); if(!token||!p.length||busy) return;
  busy=true; this.disabled=true; this.textContent="Filing…";
  p.reduce(function(a,k){return a.then(function(){return file(k);});},Promise.resolve())
   .then(function(){busy=false;render();toast("Filed "+p.length);},
         function(e){busy=false;render();toast(why(e));});
};
render();
})();
</script>
</body>
</html>
